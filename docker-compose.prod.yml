services:
  warpvault:
    image: ghcr.io/biohazard786/warpvault:latest
    container_name: warpvault
    restart: unless-stopped
    ports:
      - "${WARPVAULT_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # In-container path overrides (guaranteed to match the container VOLUME)
      - WARPVAULT_PORT=8080
      - WARPVAULT_STORAGE_PATH=/data/storage
      - WARPVAULT_DB_PATH=/data/warpvault.db
    volumes:
      - warpvault_data:/data

volumes:
  warpvault_data:
